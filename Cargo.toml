[package]
name = "bast3st-eval"
version = "0.1.0"
edition = "2024"


[dependencies]
bit-set = { version = "0.11.1", default-features = false }
bitflags = { version = "2.13.1", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["add", "add_assign", "debug", "deref", "from", "into"] }
either = { version = "1.18.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

